name: Flutter audit

on:
  pull_request:
  push:
    branches: [main, master, audit/pre-release]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safespend_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Unit and widget tests (includes catalog parity)
        run: flutter test
      - name: Android release bundle
        run: flutter build appbundle --release
      - name: Upload release bundle for review
        uses: actions/upload-artifact@v4
        with:
          name: vvollet-release-aab
          path: safespend_flutter/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
