name: safespend_flutter
description: SafeSpend Budget App - Flutter Version
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Local Storage
  shared_preferences: ^2.2.2
  connectivity_plus: ^6.0.5
  
  # Supabase
  supabase_flutter: ^2.3.0
  
  # Date/Time
  intl: ^0.20.2
  
  # Icons
  cupertino_icons: ^1.0.6
  iconify_flutter: ^0.0.7
  flutter_svg: ^2.0.9
  
  # UUID
  uuid: ^4.2.2

  # HTTP (live stock prices)
  http: ^1.2.0

  # Premium UI
  google_fonts: ^6.1.0
  fl_chart: ^0.68.0
  flutter_animate: ^4.5.0
  flutter_staggered_animations: ^1.1.1
  image_picker: ^1.0.7
  flutter_slidable: ^3.0.0
  flutter_image_compress: ^2.1.0
  file_picker: ^8.0.0
  flutter_markdown: ^0.6.18
  flutter_secure_storage: ^10.0.0
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
